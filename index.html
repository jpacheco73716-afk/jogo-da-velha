<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Velha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Jogo da Velha</h1>
    <p id="status" aria-live="polite">Vez do jogador X</p>

    <div class="board" id="board" role="grid" aria-label="Tabuleiro do jogo da velha">
      <button class="cell" type="button" data-index="0" aria-label="Casa 1"></button>
      <button class="cell" type="button" data-index="1" aria-label="Casa 2"></button>
      <button class="cell" type="button" data-index="2" aria-label="Casa 3"></button>
      <button class="cell" type="button" data-index="3" aria-label="Casa 4"></button>
      <button class="cell" type="button" data-index="4" aria-label="Casa 5"></button>
      <button class="cell" type="button" data-index="5" aria-label="Casa 6"></button>
      <button class="cell" type="button" data-index="6" aria-label="Casa 7"></button>
      <button class="cell" type="button" data-index="7" aria-label="Casa 8"></button>
      <button class="cell" type="button" data-index="8" aria-label="Casa 9"></button>
    </div>

    <button id="restart" class="restart" type="button">Reiniciar jogo</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
